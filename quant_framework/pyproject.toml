[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantframework"
version = "0.1.0"
description = "Advanced portfolio optimisation & algorithmic backtesting framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Quant Research" }]
dependencies = [
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<2.3",
    "scipy>=1.10,<1.14",
    "yfinance>=0.2.40",
    "pyarrow>=14.0",
    "matplotlib>=3.7,<3.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["quantframework*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
